name: Update Taiwan eShop Prices

on:
  schedule:
    # 台灣時間 (UTC+8) 每天 09:17 與 21:17（避開整點尖峰延遲）
    - cron: '17 1,13 * * *'
  workflow_dispatch:
    inputs:
      recheck_missing:
        description: '是否強制重查先前台灣無上架的遊戲（true / false）'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Taiwan eShop scraper
        run: |
          if [ "${{ github.event.inputs.recheck_missing }}" = "true" ]; then
            python scraper/main.py --skip-hk --recheck-missing
          else
            python scraper/main.py --skip-hk
          fi

      - name: Commit updated data and price history
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/history.json frontend/public/data/games.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected."
          else
            git commit -m "chore(data): update TW eShop prices [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
