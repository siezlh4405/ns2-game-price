name: Update Taiwan eShop Prices

on:
  schedule:
    # 台灣時間 (UTC+8) 每天 09:00 與 21:00
    - cron: '0 1,13 * * *'
  workflow_dispatch:
    inputs:
      max_hk_pages:
        description: '限制香港商店頁數（0 代表抓取全部）'
        required: false
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Taiwan eShop scraper
        run: python scraper/main.py --max-hk-pages "${{ github.event.inputs.max_hk_pages || '0' }}"

      - name: Commit updated data and price history
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json frontend/public/data/games.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected."
          else
            git commit -m "chore(data): update TW eShop prices [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
